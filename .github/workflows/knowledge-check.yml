name: Knowledge base check

# Fails a pull request that changes production code without updating the knowledge base
# (AGENTS.md / .ai/ / readme). Add the "no-docs" label when a change has no knowledge impact.

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Knowledge base updated
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check AGENTS.md / .ai/ were updated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CODE_PATHS: '^src/'
          DOC_PATHS: '^(\.ai/|AGENTS\.md$|CLAUDE\.md$|readme\.md$)'
          SKIP_LABEL: 'no-docs'
        run: |
          set -euo pipefail

          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if grep -qxF "$SKIP_LABEL" <<<"$labels"; then
            echo "::notice ::'$SKIP_LABEL' label present - knowledge base check skipped."
            exit 0
          fi

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          code=$(grep -E "$CODE_PATHS" <<<"$files" || true)
          docs=$(grep -E "$DOC_PATHS" <<<"$files" || true)

          if [[ -z "$code" ]]; then
            echo "No production code changed - nothing to check."
            exit 0
          fi

          if [[ -n "$docs" ]]; then
            echo "Knowledge base files updated in this PR:"
            echo "$docs"
            exit 0
          fi

          {
            echo "### Knowledge base not updated"
            echo "This PR changes production code but none of: \`$DOC_PATHS\`."
            echo "Update the affected files (see **Definition of done** in \`AGENTS.md\`), or add the \`$SKIP_LABEL\` label if the change has no knowledge impact."
            echo
            echo "Code files changed:"
            echo '```'
            head -n 50 <<<"$code"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error ::Production code changed without an AGENTS.md / .ai/ update. Update the knowledge base, or add the '$SKIP_LABEL' label if there is no knowledge impact."
          exit 1
